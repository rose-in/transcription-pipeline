[project]
name = "stt-pipeline"
version = "0.1.0"
description = "Production-minded transcription pipeline: any audio in, timestamped transcript out"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1,<2",
    "av>=14",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# CTranslate2 dlopens libcublas.so.12; the wheel avoids a CUDA base image (see Dockerfile).
gpu = ["nvidia-cublas-cu12>=12.4,<13; sys_platform == 'linux'"]

[project.scripts]
stt = "stt_pipeline.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jiwer>=4.0.0",
    "pytest>=9.1.1",
    "whisper-normalizer>=0.1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a real Whisper model (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]
