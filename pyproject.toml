[project]
name = "stt-pipeline"
version = "0.1.0"
description = "Production-minded transcription pipeline: any audio in, timestamped transcript out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # <1.3: engines/faster_whisper_engine._SeekAware overrides the private
    # WhisperModel._split_segments_by_timestamps hook; re-verify before widening.
    "faster-whisper>=1.2.1,<1.3",
    "av>=14",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
# CTranslate2 dlopens libcublas.so.12; the wheel avoids a CUDA base image (see Dockerfile).
gpu = ["nvidia-cublas-cu12>=12.4,<13; sys_platform == 'linux'"]

[project.scripts]
stt = "stt_pipeline.cli:main"

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15",
    "whisper-normalizer>=0.1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs a real Whisper model; deselected by default, run with `pytest -m slow`"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E731"]  # long lines are left to the formatter; short named lambdas in tests are fine
